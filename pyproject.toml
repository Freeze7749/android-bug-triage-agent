[project]
name = "android-bug-triage-agent"
version = "0.1.0"
description = "Turn Android logcat and radio logs into evidence-linked bug report drafts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.4,<3",
    "drain3>=0.9.11,<1",
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
triage = "triage_agent.cli:main"
triage-mcp = "triage_agent.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
